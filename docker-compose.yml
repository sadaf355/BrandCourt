services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: brandcourt
      POSTGRES_USER: brandcourt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-change-me}
    ports: ["5432:5432"]
    volumes: ["brandcourt_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandcourt -d brandcourt"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: 2.0.0
      DATABASE_URL: postgresql+asyncpg://brandcourt:${POSTGRES_PASSWORD:-local-demo-change-me}@db:5432/brandcourt
      SECRET_KEY: ${SECRET_KEY:-change-this-local-only-secret-before-deploy}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MODEL_MODE: ${MODEL_MODE:-deterministic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-15}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-900}
    ports: ["8000:8000"]
    volumes: ["brandcourt_uploads:/app/uploads"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  worker:
    build: ./backend
    command: ["python", "-m", "app.core.job_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://brandcourt:${POSTGRES_PASSWORD:-local-demo-change-me}@db:5432/brandcourt
      SECRET_KEY: ${SECRET_KEY:-change-this-local-only-secret-before-deploy}
      UPLOAD_DIR: /app/uploads
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      MODEL_MODE: ${MODEL_MODE:-deterministic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      JOB_POLL_SECONDS: ${JOB_POLL_SECONDS:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
      JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-15}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-900}
    volumes: ["brandcourt_uploads:/app/uploads"]
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    restart: unless-stopped
  fact-expiry:
    build: ./backend
    command:
      [
        "python",
        "-m",
        "scripts.expire_facts",
        "--watch",
        "--interval-hours",
        "${FACT_EXPIRY_INTERVAL_HOURS:-24}",
      ]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://brandcourt:${POSTGRES_PASSWORD:-local-demo-change-me}@db:5432/brandcourt
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports: ["8080:80"]
    depends_on: [api]
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-model"]
    ports: ["11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
volumes:
  brandcourt_db:
  brandcourt_uploads:
  ollama_data:
