services:
  - type: web
    name: brandcourt-api
    runtime: docker
    rootDir: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://brandcourt.vercel.app
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: JOB_WORKER_ENABLED
        value: "true"
      - key: MODEL_MODE
        value: deterministic
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: DEMO_RESET_ON_START
        value: "false"
      - key: LOGIN_MAX_FAILURES
        value: "10"
